<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Task Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blue:#3B6EF8;--blue-lt:#EEF2FF;--blue-dk:#1E40AF;
      --purple:#8B5CF6;--purple-lt:#F3EEFF;--purple-dk:#5B21B6;
      --green:#10B981;--green-lt:#ECFDF5;--green-dk:#065F46;
      --amber:#F59E0B;--amber-lt:#FFFBEB;--amber-dk:#92400E;
      --red:#EF4444;--red-lt:#FEF2F2;--red-dk:#991B1B;
      --sky:#06B6D4;--sky-lt:#ECFEFF;
      --bg:#F0F4FF;--surface:#FFFFFF;--border:#E2E8F0;
      --text:#0F172A;--text-2:#64748B;--text-3:#94A3B8;
      --radius:16px;--radius-sm:10px;--radius-xs:6px;
      --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 20px rgba(59,110,248,.08);
      --shadow-lg:0 8px 40px rgba(59,110,248,.15);
    }
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

    /* ── HEADER ── */
    .app-header{background:linear-gradient(135deg,#3B6EF8 0%,#8B5CF6 100%);padding:20px 36px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 24px rgba(59,110,248,.3)}
    .header-left{display:flex;align-items:center;gap:14px}
    .logo-mark{width:44px;height:44px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);color:#fff;border-radius:12px;display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:13px;font-weight:500;border:1.5px solid rgba(255,255,255,.3)}
    .app-title{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.03em}
    .app-subtitle{font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
    .header-right{display:flex;align-items:center;gap:10px}
    .sync-time{font-size:12px;color:rgba(255,255,255,.7);font-family:'DM Mono',monospace}
    .refresh-btn{padding:8px 16px;border:1.5px solid rgba(255,255,255,.35);border-radius:var(--radius-sm);background:rgba(255,255,255,.15);color:#fff;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;transition:background .15s}
    .refresh-btn:hover{background:rgba(255,255,255,.25)}

    /* ── TABS ── */
    .tab-nav{display:flex;gap:0;padding:0 36px;background:#fff;border-bottom:2px solid var(--border);overflow-x:auto}
    .tab-btn{padding:14px 28px;border:none;background:none;font-size:14px;font-family:'Inter',sans-serif;font-weight:600;color:var(--text-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;letter-spacing:-.01em}
    .tab-btn:hover{color:var(--blue);background:#F8FAFF}
    .tab-btn.active-prabnoor{color:var(--blue);border-bottom-color:var(--blue)}
    .tab-btn.active-kritik{color:var(--purple);border-bottom-color:var(--purple)}
    .tab-btn.active-supervisor{color:#0EA5E9;border-bottom-color:#0EA5E9}

    /* ── MAIN ── */
    .main-content{padding:28px 36px;max-width:1280px;margin:0 auto}

    /* ── PROGRESS CARD ── */
    .progress-card{border-radius:var(--radius);padding:22px 26px;margin-bottom:28px;display:flex;align-items:center;gap:28px;box-shadow:var(--shadow)}
    .progress-card.blue{background:linear-gradient(135deg,var(--blue-lt),#E0E9FF)}
    .progress-card.purple{background:linear-gradient(135deg,var(--purple-lt),#EBE4FF)}
    .progress-card.sky{background:linear-gradient(135deg,var(--sky-lt),#E0F9FF)}
    .progress-pct{font-size:42px;font-weight:700;font-family:'DM Mono',monospace;letter-spacing:-.04em;line-height:1}
    .progress-pct.blue{color:var(--blue)}
    .progress-pct.purple{color:var(--purple)}
    .progress-pct.sky{color:#0EA5E9}
    .progress-right{flex:1}
    .progress-label{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
    .progress-bar-bg{height:10px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;position:relative}
    .progress-bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:99px;transition:width .5s ease}
    .done-fill.blue{background:var(--blue)}
    .done-fill.purple{background:var(--purple)}
    .done-fill.sky{background:#0EA5E9}
    .ip-fill{background:var(--green);left:var(--done-pct)}
    .progress-chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.02em}
    .chip-done{background:var(--green-lt);color:var(--green-dk)}
    .chip-ip{background:var(--blue-lt);color:var(--blue-dk)}
    .chip-ns{background:#F1F5F9;color:var(--text-2)}

    /* ── ROADMAP GRID ── */
    .roadmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}

    /* ── TASK CARD ── */
    .task-card{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;border:1.5px solid var(--border);position:relative;overflow:hidden}
    .task-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
    .task-card.urgent::before{background:linear-gradient(90deg,#EF4444,#F97316)}
    .task-card.important::before{background:linear-gradient(90deg,#F59E0B,#FBBF24)}
    .task-card.normal::before{background:linear-gradient(90deg,#10B981,#34D399)}
    .task-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
    .task-card.done{opacity:.6}
    .task-card.overdue{border-color:#FCA5A5}

    .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
    .card-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

    .priority-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase}
    .priority-badge.urgent{background:var(--red-lt);color:var(--red-dk)}
    .priority-badge.important{background:var(--amber-lt);color:var(--amber-dk)}
    .priority-badge.normal{background:var(--green-lt);color:var(--green-dk)}

    .deadline-badge{font-size:11px;font-weight:500;padding:4px 10px;border-radius:99px;background:#F1F5F9;color:var(--text-2);font-family:'DM Mono',monospace}
    .deadline-badge.overdue{background:var(--red-lt);color:var(--red-dk);font-weight:700}
    .deadline-badge.soon{background:var(--amber-lt);color:var(--amber-dk);font-weight:700}

    .task-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:10px;letter-spacing:-.02em}
    .task-title.done-title{text-decoration:line-through;color:var(--text-3)}

    .checkpoints{background:#F8FAFF;border-radius:var(--radius-xs);padding:10px 12px;margin-bottom:10px;border-left:3px solid var(--blue)}
    .checkpoints-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:5px}
    .checkpoints-text{font-size:12px;color:var(--text-2);line-height:1.6;white-space:pre-line}

    .remarks-box{background:#FFFBF0;border-radius:var(--radius-xs);padding:10px 12px;margin-bottom:10px;border-left:3px solid var(--amber)}
    .remarks-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-dk);margin-bottom:4px}
    .remarks-text{font-size:12px;color:#78350F;line-height:1.5;font-style:italic}

    .completion-info{font-size:11px;color:var(--green-dk);background:var(--green-lt);padding:5px 10px;border-radius:var(--radius-xs);font-family:'DM Mono',monospace;margin-bottom:10px}

    /* ── STATUS BUTTON ── */
    .status-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:6px 14px;border:1.5px solid;border-radius:var(--radius-xs);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
    .status-btn.not-started{background:#F1F5F9;color:#475569;border-color:#CBD5E1}
    .status-btn.in-progress{background:var(--blue-lt);color:var(--blue-dk);border-color:#BFDBFE}
    .status-btn.blocked{background:var(--amber-lt);color:var(--amber-dk);border-color:#FDE68A}
    .status-btn.done{background:var(--green-lt);color:var(--green-dk);border-color:#A7F3D0}
    .status-btn:not(.readonly):hover{filter:brightness(.93);transform:scale(.97)}
    .status-btn.readonly{cursor:default}
    .next-hint{font-size:10px;opacity:.55;font-weight:400}

    /* ── SUPERVISOR SECTIONS ── */
    .supervisor-view{display:flex;flex-direction:column;gap:32px}
    .sup-section{background:var(--surface);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);border:1.5px solid var(--border)}
    .sup-section-header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .sup-avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
    .sup-avatar.blue{background:linear-gradient(135deg,var(--blue),#6366F1)}
    .sup-avatar.purple{background:linear-gradient(135deg,var(--purple),#EC4899)}
    .sup-name{font-size:18px;font-weight:700;letter-spacing:-.02em}
    .sup-name.blue{color:var(--blue-dk)}
    .sup-name.purple{color:var(--purple-dk)}

    /* ── STATES ── */
    .loading{display:flex;align-items:center;gap:12px;color:var(--text-2);padding:60px 0;justify-content:center}
    .spinner{width:24px;height:24px;border:2.5px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-msg{background:var(--red-lt);border:1.5px solid #FECACA;color:var(--red-dk);border-radius:var(--radius);padding:18px 22px;font-size:14px}
    .empty{color:var(--text-3);font-size:14px;padding:40px;text-align:center;border:2px dashed var(--border);border-radius:var(--radius);background:#FAFBFF}
    .setup-banner{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,var(--amber-lt),#FFF9EB);border-top:2px solid #FDE68A;color:var(--amber-dk);padding:12px 36px;font-size:13px;text-align:center;font-weight:500}
    .setup-banner code{font-family:'DM Mono',monospace;background:#FDE68A66;padding:2px 7px;border-radius:4px}

    @media(max-width:768px){
      .app-header{padding:14px 16px}
      .main-content{padding:16px}
      .roadmap-grid{grid-template-columns:1fr}
      .progress-card{flex-direction:column;gap:16px}
      .tab-nav{padding:0 8px}
      .tab-btn{padding:12px 16px;font-size:13px}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const SHEET_URLS = {
  "Prabnoor": "https://docs.google.com/spreadsheets/d/1XVbZoniPPAYQewbpJmUQ-tRIpnMYtCGf0azZceGpqHQ/export?format=csv&gid=0",
  "Kritik":   "https://docs.google.com/spreadsheets/d/1XVbZoniPPAYQewbpJmUQ-tRIpnMYtCGf0azZceGpqHQ/export?format=csv&gid=265699685",
};
const EXEC_NAMES = ["Prabnoor", "Kritik"];

const STATUS_CYCLE = ["Not Started","In Progress","Blocked","Done"];
const pOrder = {Urgent:0,Important:1,Normal:2};

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h=>h.trim().replace(/^"|"$/g,""));
  return lines.slice(1).map(line=>{
    const vals=line.split(",").map(v=>v.trim().replace(/^"|"$/g,""));
    return headers.reduce((obj,h,i)=>({...obj,[h]:vals[i]||""}),{});
  });
}
function loadOverrides(){try{return JSON.parse(localStorage.getItem("taskOverrides")||"{}");}catch{return {};}}
function saveOverrides(d){localStorage.setItem("taskOverrides",JSON.stringify(d));}

function PriorityBadge({priority}){
  const cls = {Urgent:"urgent",Important:"important",Normal:"normal"}[priority]||"normal";
  const icons = {Urgent:"🔴",Important:"🟡",Normal:"🟢"};
  return <span className={`priority-badge ${cls}`}>{icons[priority]||"🟢"} {priority||"Normal"}</span>;
}

function StatusButton({status,onClick,readonly}){
  const s = status||"Not Started";
  const cls = {
    "Not Started":"not-started",
    "In Progress":"in-progress",
    "Blocked":"blocked",
    "Done":"done"
  }[s]||"not-started";
  const icons={"Not Started":"○","In Progress":"⟳","Blocked":"⚠","Done":"✓"};
  const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(s)+1)%STATUS_CYCLE.length];
  return (
    <button className={`status-btn ${cls} ${readonly?"readonly":""}`} onClick={readonly?undefined:onClick}>
      <span>{icons[s]||"○"}</span>{s}
      {!readonly&&<span className="next-hint">→ {next}</span>}
    </button>
  );
}

function TaskCard({task,onStatusChange,readonly,accentColor}){
  const status = task.Status||"Not Started";
  const priority = task["Priority"]||"Normal";
  const daysLeft = task["Date"] ? Math.ceil((new Date(task["Date"])-new Date())/86400000) : null;
  const isOverdue = daysLeft!==null && daysLeft<0 && status!=="Done";
  const isDueSoon = daysLeft!==null && daysLeft<=3 && daysLeft>=0 && status!=="Done";
  const prCls = {Urgent:"urgent",Important:"important",Normal:"normal"}[priority]||"normal";

  return (
    <div className={`task-card ${prCls} ${status==="Done"?"done":""} ${isOverdue?"overdue":""}`}>
      <div className="card-top">
        <div className="card-badges">
          <PriorityBadge priority={priority}/>
          {task["Date"]&&(
            <span className={`deadline-badge ${isOverdue?"overdue":isDueSoon?"soon":""}`}>
              {isOverdue?`⚠ ${Math.abs(daysLeft)}d overdue`:isDueSoon?`⏰ ${daysLeft}d left`:`📅 ${task["Date"]}`}
            </span>
          )}
        </div>
        <StatusButton status={status} onClick={onStatusChange} readonly={readonly}/>
      </div>

      <div className={`task-title ${status==="Done"?"done-title":""}`}>{task["Task Name"]||"Untitled"}</div>

      {task["Checkpoints"]&&(
        <div className="checkpoints">
          <div className="checkpoints-label">Checkpoints</div>
          <div className="checkpoints-text">{task["Checkpoints"]}</div>
        </div>
      )}

      {task["Remarks"]&&(
        <div className="remarks-box">
          <div className="remarks-label">💬 Remarks</div>
          <div className="remarks-text">{task["Remarks"]}</div>
        </div>
      )}

      {status==="Done"&&task["Completion Time"]&&(
        <div className="completion-info">✅ Completed {task["Completion Time"]}</div>
      )}
    </div>
  );
}

function ProgressCard({tasks,color,name}){
  const done = tasks.filter(t=>t.Status==="Done").length;
  const inP  = tasks.filter(t=>t.Status==="In Progress").length;
  const pct  = tasks.length?Math.round(done/tasks.length*100):0;
  const iPct = tasks.length?Math.round(inP/tasks.length*100):0;
  return (
    <div className={`progress-card ${color}`}>
      <div className={`progress-pct ${color}`}>{pct}%</div>
      <div className="progress-right">
        <div className="progress-label">{name} — Task Completion</div>
        <div className="progress-bar-bg">
          <div className={`progress-bar-fill done-fill ${color}`} style={{width:`${pct}%`}}/>
          <div className="progress-bar-fill ip-fill" style={{"--done-pct":`${pct}%`,width:`${iPct}%`}}/>
        </div>
        <div className="progress-chips">
          <span className="chip chip-done">✓ {done} done</span>
          <span className="chip chip-ip">⟳ {inP} in progress</span>
          <span className="chip chip-ns">○ {tasks.length-done-inP} not started</span>
        </div>
      </div>
    </div>
  );
}

function ExecTab({tasks,execName,overrides,onStatusChange,color}){
  const myTasks = tasks
    .filter(t=>t.Assignee===execName&&t["Task Name"])
    .map(t=>({...t,Status:overrides[t._id]||t["Status"]||"Not Started"}))
    .sort((a,b)=>(pOrder[a["Priority"]]??2)-(pOrder[b["Priority"]]??2));
  return (
    <div>
      <ProgressCard tasks={myTasks} color={color} name={execName}/>
      {myTasks.length===0
        ?<div className="empty">No tasks yet — manager adds them to the Google Sheet.</div>
        :<div className="roadmap-grid">
          {myTasks.map(task=>(
            <TaskCard key={task._id} task={task} readonly={false}
              onStatusChange={()=>onStatusChange(task._id,task.Status)} accentColor={color}/>
          ))}
        </div>}
    </div>
  );
}

function SupervisorTab({tasks,overrides}){
  const configs = [{name:"Prabnoor",color:"blue",initial:"P"},{name:"Kritik",color:"purple",initial:"K"}];
  const all = tasks.map(t=>({...t,Status:overrides[t._id]||t["Status"]||"Not Started"}));
  return (
    <div className="supervisor-view">
      {configs.map(({name,color,initial})=>{
        const myTasks = all.filter(t=>t.Assignee===name&&t["Task Name"]).sort((a,b)=>(pOrder[a["Priority"]]??2)-(pOrder[b["Priority"]]??2));
        return (
          <div key={name} className="sup-section">
            <div className="sup-section-header">
              <div className={`sup-avatar ${color}`}>{initial}</div>
              <div className={`sup-name ${color}`}>{name}</div>
            </div>
            <ProgressCard tasks={myTasks} color={color} name={name}/>
            {myTasks.length===0
              ?<div className="empty">No tasks yet.</div>
              :<div className="roadmap-grid">
                {myTasks.map(task=><TaskCard key={task._id} task={task} readonly={true}/>)}
              </div>}
          </div>
        );
      })}
    </div>
  );
}

const DEMO=[
  {_id:"d1",Assignee:"Prabnoor","Task Name":"Review weekly email campaign","Priority":"Important","Date":"2026-07-20","Checkpoints":"1. Draft subject lines\n2. Review copy\n3. Schedule send","Remarks":"Ensure open rate targets are met","Completion Time":"","Status":"In Progress"},
  {_id:"d2",Assignee:"Prabnoor","Task Name":"Update master contact database","Priority":"Normal","Date":"2026-07-25","Checkpoints":"1. Dedupe contacts\n2. Add new leads","Remarks":"","Completion Time":"","Status":"Not Started"},
  {_id:"d3",Assignee:"Prabnoor","Task Name":"Diwali outreach campaign","Priority":"Urgent","Date":"2026-07-18","Checkpoints":"1. Segment database\n2. Draft emails\n3. Schedule","Remarks":"Critical for Q3 pipeline","Completion Time":"","Status":"Not Started"},
  {_id:"d4",Assignee:"Kritik","Task Name":"Vendor follow-up call","Priority":"Normal","Date":"2026-07-22","Checkpoints":"1. Prepare agenda\n2. Confirm timelines\n3. Log outcome","Remarks":"","Completion Time":"","Status":"In Progress"},
  {_id:"d5",Assignee:"Kritik","Task Name":"Diwali stock readiness check","Priority":"Urgent","Date":"2026-07-19","Checkpoints":"1. SKU-wise stock plan\n2. Vendor capacity check","Remarks":"Escalate if any SKU at risk","Completion Time":"","Status":"Not Started"},
  {_id:"d6",Assignee:"Kritik","Task Name":"Weekly dispatch status report","Priority":"Important","Date":"2026-07-18","Checkpoints":"1. Compile dispatch list\n2. Flag delays","Remarks":"Feeds Friday wrap-up","Completion Time":"16 Jul 2026, 10:30","Status":"Done"},
];

function App(){
  const [tasks,setTasks]=useState([]);
  const [overrides,setOverrides]=useState(loadOverrides);
  const [activeTab,setActiveTab]=useState(0);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [lastSync,setLastSync]=useState(null);
  const isDemo=Object.values(SHEET_URLS).some(u=>u.includes("YOUR_"));

  const fetchTasks=useCallback(async()=>{
    if(isDemo){setTasks(DEMO);setLoading(false);setLastSync(new Date());return;}
    try{
      const results=await Promise.all(EXEC_NAMES.map(async name=>{
        const proxy="https://corsproxy.io/?url="; const res=await fetch(proxy+encodeURIComponent(SHEET_URLS[name]));
        if(!res.ok) throw new Error();
        return parseCSV(await res.text()).map((r,i)=>({...r,_id:`${name}-${i}`,Assignee:name}));
      }));
      setTasks(results.flat());setLastSync(new Date());setError(null);
    }catch{setError("Could not load tasks. Check the sheet is published correctly.");}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{fetchTasks();const t=setInterval(fetchTasks,60000);return()=>clearInterval(t);},[fetchTasks]);

  const handleStatus=(id,current)=>{
    const next=STATUS_CYCLE[(STATUS_CYCLE.indexOf(current||"Not Started")+1)%STATUS_CYCLE.length];
    const u={...overrides,[id]:next};setOverrides(u);saveOverrides(u);
  };

  const tabs=[
    {label:"Prabnoor",icon:"👤",active:"active-prabnoor",color:"blue"},
    {label:"Kritik",icon:"👤",active:"active-kritik",color:"purple"},
    {label:"👁 Supervisor",icon:"",active:"active-supervisor",color:"sky"},
  ];

  return(
    <div>
      <header className="app-header">
        <div className="header-left">
          <div className="logo-mark">TD</div>
          <div>
            <div className="app-title">Task Dashboard</div>
            <div className="app-subtitle">Delegation · Roadmap · Progress</div>
          </div>
        </div>
        <div className="header-right">
          {lastSync&&<span className="sync-time">Synced {lastSync.toLocaleTimeString()}</span>}
          <button className="refresh-btn" onClick={fetchTasks}>↻ Refresh</button>
        </div>
      </header>

      <nav className="tab-nav">
        {tabs.map((tab,i)=>(
          <button key={tab.label} className={`tab-btn ${activeTab===i?tab.active:""}`} onClick={()=>setActiveTab(i)}>
            {tab.label}
          </button>
        ))}
      </nav>

      <main className="main-content">
        {loading&&<div className="loading"><div className="spinner"/>Loading tasks…</div>}
        {error&&<div className="error-msg">⚠ {error}</div>}
        {!loading&&!error&&<>
          {activeTab===0&&<ExecTab tasks={tasks} execName="Prabnoor" overrides={overrides} onStatusChange={handleStatus} color="blue"/>}
          {activeTab===1&&<ExecTab tasks={tasks} execName="Kritik" overrides={overrides} onStatusChange={handleStatus} color="purple"/>}
          {activeTab===2&&<SupervisorTab tasks={tasks} overrides={overrides}/>}
        </>}
      </main>

      {isDemo&&<div className="setup-banner">📋 <strong>Demo mode</strong> — connect your Google Sheet by replacing the URLs in <code>SHEET_URLS</code>.</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
