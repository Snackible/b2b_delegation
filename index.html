<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Snackible B2B Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const PROXY = "https://script.google.com/a/macros/snackible.com/s/AKfycbxxuPIWVlrpAbHF9dz5UyJAjpJmTJDyyQxSjyPhDMAhl7guQip5-4WGxbxuvMay3reD/exec";
const SALES_SHEET_NAME = "Sales";
const EXEC_NAMES = ["Prabnoor","Kritik"];
const STATUS_CYCLE = ["Not Started","In Progress","Blocked","Done"];
const pOrder = {Urgent:0,Important:1,Normal:2};
const PIPELINE_STAGES = [
  {key:"Follow-up",label:"Follow-up"},
  {key:"Reach Out",label:"Reach Out"},
  {key:"Orders/Catalog",label:"Orders / Catalog"},
];
const DATE_FILTERS = ["Lifetime","This Month","Last Month","This Week","Custom"];

// ── HELPERS ──────────────────────────────────────────────────────────────────
function parseCSV(text){
  const lines = text.trim().split("\n");
  if(lines.length < 2) return [];
  const headers = lines[0].split(",").map(h=>h.trim().replace(/^"|"$/g,""));
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const vals=[];let cur="",inQ=false;
    for(let ch of line){
      if(ch==='"') inQ=!inQ;
      else if(ch===',' && !inQ){vals.push(cur.trim());cur="";}
      else cur+=ch;
    }
    vals.push(cur.trim());
    return headers.reduce((obj,h,i)=>({...obj,[h]:vals[i]||""}),{});
  });
}

function parseSalesDate(str){
  if(!str) return null;
  str=str.trim();
  let m=str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){const y=m[3].length===2?2000+(+m[3]):(+m[3]);return new Date(y,+m[2]-1,+m[1]);}
  m=str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(str);return isNaN(d.getTime())?null:d;
}

function parseSalesAmt(str){
  if(!str) return 0;
  const n=parseFloat(String(str).replace(/[₹,\s]/g,""));
  return isNaN(n)?0:n;
}

function formatINR(n){
  if(!n||isNaN(n)) return "₹0";
  if(n>=10000000) return "₹"+(n/10000000).toFixed(2)+"Cr";
  if(n>=100000) return "₹"+(n/100000).toFixed(2)+"L";
  if(n>=1000) return "₹"+(n/1000).toFixed(1)+"K";
  return "₹"+n.toLocaleString("en-IN");
}

function getToday(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}

function getDateRange(filter,customFrom,customTo){
  if(filter==="Lifetime") return null;
  const today=getToday();
  if(filter==="This Month") return {from:new Date(today.getFullYear(),today.getMonth(),1),to:today};
  if(filter==="Last Month") return {from:new Date(today.getFullYear(),today.getMonth()-1,1),to:new Date(today.getFullYear(),today.getMonth(),0)};
  if(filter==="This Week"){
    const dow=today.getDay();
    const from=new Date(today);
    from.setDate(today.getDate()-(dow===0?6:dow-1));
    return {from,to:today};
  }
  if(filter==="Custom"&&customFrom&&customTo) return {from:new Date(customFrom),to:new Date(customTo)};
  return null;
}

function filterSalesByDate(rows,filter,customFrom,customTo){
  const range=getDateRange(filter,customFrom,customTo);
  if(!range) return rows;
  return rows.filter(r=>{
    const d=parseSalesDate(r["Order Date"]);
    if(!d) return false;
    return d>=range.from && d<=range.to;
  });
}

function isDiwali(t){return t["Department"]==="Diwali"||(t["Task Name"]||"").toLowerCase().includes("diwali");}
function getDept(t){return isDiwali(t)?"Diwali":(t["Department"]||"");}
function loadOverrides(){try{return JSON.parse(localStorage.getItem("taskOverrides")||"{}");}catch{return {};}}
function saveOverrides(d){localStorage.setItem("taskOverrides",JSON.stringify(d));}

// ── REACT ALIASES ─────────────────────────────────────────────────────────────
const {useState,useEffect,useCallback,useMemo} = React;
const e = React.createElement;

// ── COMPONENTS ────────────────────────────────────────────────────────────────
function PriorityBadge({priority}){
  const cls={Urgent:"urgent",Important:"important",Normal:"normal"}[priority]||"normal";
  const icons={Urgent:"🔴",Important:"🟡",Normal:"🟢"};
  return e("span",{className:`priority-badge ${cls}`},(icons[priority]||"🟢")+" "+(priority||"Normal"));
}

function StatusButton({status,onClick,readonly}){
  const s=status||"Not Started";
  const cls={"Not Started":"not-started","In Progress":"in-progress","Blocked":"blocked","Done":"done"}[s]||"not-started";
  const icons={"Not Started":"○","In Progress":"⟳","Blocked":"⚠","Done":"✓"};
  const next=STATUS_CYCLE[(STATUS_CYCLE.indexOf(s)+1)%STATUS_CYCLE.length];
  return e("button",{className:`status-btn ${cls} ${readonly?"readonly":""}`,onClick:readonly?undefined:onClick},
    e("span",null,icons[s]||"○"),
    s,
    !readonly && e("span",{className:"next-hint"},"→"+next)
  );
}

function TaskCard({task,onStatusChange}){
  const status=task.Status||"Not Started";
  const priority=task["Priority"]||"Normal";
  const daysLeft=task["Date"]?Math.ceil((new Date(task["Date"])-new Date())/86400000):null;
  const isOverdue=daysLeft!==null&&daysLeft<0&&status!=="Done";
  const isDueSoon=daysLeft!==null&&daysLeft<=3&&daysLeft>=0&&status!=="Done";
  const prCls={Urgent:"urgent",Important:"important",Normal:"normal"}[priority]||"normal";
  return e("div",{className:`task-card ${prCls} ${status==="Done"?"done":""} ${isOverdue?"overdue":""}`},
    e("div",{className:"card-top"},
      e("div",{className:"card-badges"},
        e(PriorityBadge,{priority}),
        task["Date"] && e("span",{className:`deadline-badge ${isOverdue?"overdue":isDueSoon?"soon":""}`},
          isOverdue?`⚠ ${Math.abs(daysLeft)}d`:isDueSoon?`⏰ ${daysLeft}d`:`📅 ${task["Date"]}`
        )
      ),
      e(StatusButton,{status,onClick:onStatusChange})
    ),
    e("div",{className:`task-title ${status==="Done"?"done-title":""}`},task["Task Name"]||"Untitled"),
    task["Remarks"] && e("div",{className:"remarks-box"},
      e("div",{className:"remarks-label"},"💬 Remarks"),
      e("div",{className:"remarks-text"},task["Remarks"])
    ),
    status==="Done" && task["Completion Time"] && e("div",{className:"completion-info"},"✅ "+task["Completion Time"])
  );
}

function DateFilterBar({value,onChange,customFrom,customTo,onCustomChange,colorClass}){
  return e("div",{className:"date-filter-wrap"},
    e("span",{className:"date-filter-label"},"Period"),
    ...DATE_FILTERS.map(f=>
      e("button",{key:f,className:`date-filter-btn ${value===f?"active-"+colorClass:""}`,onClick:()=>onChange(f)},f)
    ),
    value==="Custom" && e("div",{className:"custom-dates"},
      e("input",{type:"date",value:customFrom,onChange:ev=>onCustomChange("from",ev.target.value),className:"date-input"}),
      e("span",{className:"date-sep"},"→"),
      e("input",{type:"date",value:customTo,onChange:ev=>onCustomChange("to",ev.target.value),className:"date-input"})
    )
  );
}

function KPIBar({tasks,salesTotal,salesCount,salesLoading}){
  const isChecked=v=>v===true||v==="TRUE"||v==="true";
  const has=col=>tasks.some(t=>t[col]!==undefined&&t[col]!=="");
  const mailCount=has("Mail Sent")?tasks.filter(t=>isChecked(t["Mail Sent"])).length:null;
  const callCount=has("Call Done")?tasks.filter(t=>isChecked(t["Call Done"])).length:null;
  const liCount=has("LinkedIn")?tasks.filter(t=>isChecked(t["LinkedIn"])).length:null;
  const sampCount=has("Sample Sent")?tasks.filter(t=>isChecked(t["Sample Sent"])).length:null;
  const kpis=[
    {label:"Gross Sales",value:salesLoading?"…":formatINR(salesTotal),sub:salesLoading?null:`${salesCount} order${salesCount===1?"":"s"}`,cls:"kpi-sales",color:"green"},
    {label:"Mails",value:mailCount!==null?mailCount:"—",cls:"kpi-mails",color:"amber"},
    {label:"Calls",value:callCount!==null?callCount:"—",cls:"kpi-calls",color:"blue"},
    {label:"LinkedIn",value:liCount!==null?liCount:"—",cls:"kpi-linkedin",color:"purple"},
    {label:"Samples Sent",value:sampCount!==null?sampCount:"—",cls:"kpi-samples",color:"sky"},
  ];
  return e("div",{className:"kpi-bar"},
    ...kpis.map(k=>
      e("div",{key:k.label,className:`kpi-card ${k.cls}`},
        e("div",{className:"kpi-label"},k.label),
        e("div",{className:`kpi-value ${k.color}`},k.value),
        k.sub && e("div",{className:"kpi-sub"},k.sub)
      )
    )
  );
}

function ProgressCard({tasks,colorClass,name}){
  const done=tasks.filter(t=>t.Status==="Done").length;
  const inP=tasks.filter(t=>t.Status==="In Progress").length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const iPct=tasks.length?Math.round(inP/tasks.length*100):0;
  return e("div",{className:"progress-card"},
    e("div",{className:`progress-pct ${colorClass}`},pct+"%"),
    e("div",{className:"progress-right"},
      e("div",{className:"progress-label"},name+" — Task Completion"),
      e("div",{className:"progress-bar-bg"},
        e("div",{className:`progress-bar-fill done-fill ${colorClass}`,style:{width:`${pct}%`}}),
        e("div",{className:"progress-bar-fill ip-fill",style:{"--done-pct":`${pct}%`,width:`${iPct}%`}})
      ),
      e("div",{className:"progress-chips"},
        e("span",{className:"chip chip-done"},"✓ "+done+" done"),
        e("span",{className:"chip chip-ip"},"⟳ "+inP+" in progress"),
        e("span",{className:"chip chip-ns"},"○ "+(tasks.length-done-inP)+" pending")
      )
    )
  );
}

// ── ACCORDION COLUMN ──────────────────────────────────────────────────────────
function AccordionColumn({id,openId,onToggle,headerCls,icon,label,count,extraBadge,colCls,children}){
  const isOpen=openId===id;
  return e("div",{className:`accordion-col ${isOpen?"open":"collapsed"} ${colCls||""}`},
    e("div",{className:`accordion-header ${headerCls}`,onClick:()=>onToggle(id)},
      e("div",{className:"accordion-header-left"},
        e("span",{className:"accordion-header-icon"},icon),
        e("span",{className:"accordion-header-label"},label)
      ),
      e("div",{className:"accordion-header-right"},
        extraBadge && e("span",{className:"priority-badge-header"},extraBadge),
        e("span",{className:"col-count"},count),
        e("span",{className:"chevron"},"▼")
      )
    ),
    e("div",{className:"accordion-body"},children)
  );
}

// ── COLUMN CONTENT COMPONENTS ─────────────────────────────────────────────────
function DepartmentsContent({tasks,onStatusChange}){
  const depts=[{key:"RND",label:"RND 🔬"},{key:"Marketing",label:"Marketing 📣"},{key:"Operations",label:"Operations ⚙️"}];
  const sorted=arr=>[...arr].sort((a,b)=>(pOrder[a["Priority"]]??2)-(pOrder[b["Priority"]]??2));
  const allEmpty=depts.every(d=>tasks.filter(t=>t["Department"]===d.key).length===0);
  if(allEmpty) return e("div",{className:"column-empty"},"No department tasks yet");
  return e("div",null,
    ...depts.map(dept=>{
      const dt=sorted(tasks.filter(t=>t["Department"]===dept.key));
      if(!dt.length) return null;
      return e("div",{key:dept.key,className:"dept-section"},
        e("div",{className:"dept-section-label"},dept.label),
        e("div",{className:"column-tasks"},
          ...dt.map(task=>e(TaskCard,{key:task._id,task,onStatusChange:()=>onStatusChange(task._id,task.Status)}))
        )
      );
    })
  );
}

function DiwaliContent({tasks,onStatusChange}){
  const sorted=[...tasks].sort((a,b)=>(pOrder[a["Priority"]]??2)-(pOrder[b["Priority"]]??2));
  if(!sorted.length) return e("div",{className:"column-empty"},"No Diwali tasks");
  return e("div",{className:"column-tasks"},
    ...sorted.map(task=>e(TaskCard,{key:task._id,task,onStatusChange:()=>onStatusChange(task._id,task.Status)}))
  );
}

function PipelineContent({tasks,onStatusChange}){
  if(!tasks.length) return e("div",{className:"column-empty"},"No pipeline tasks");
  return e("div",null,
    ...PIPELINE_STAGES.map(stage=>{
      const st=tasks.filter(t=>(t["Pipeline Stage"]||"Follow-up")===stage.key);
      if(!st.length) return null;
      return e("div",{key:stage.key},
        e("div",{className:"pipeline-stage-label"},stage.label),
        e("div",{className:"column-tasks"},
          ...st.map(task=>e(TaskCard,{key:task._id,task,onStatusChange:()=>onStatusChange(task._id,task.Status)}))
        )
      );
    })
  );
}

function ClientsContent({tasks,onStatusChange}){
  const sorted=[...tasks].sort((a,b)=>(pOrder[a["Priority"]]??2)-(pOrder[b["Priority"]]??2));
  if(!sorted.length) return e("div",{className:"column-empty"},"No client tasks");
  return e("div",{className:"column-tasks"},
    ...sorted.map(task=>e(TaskCard,{key:task._id,task,onStatusChange:()=>onStatusChange(task._id,task.Status)}))
  );
}

// ── COLUMNS VIEW ──────────────────────────────────────────────────────────────
function ColumnsView({tasks,onStatusChange}){
  const [openId,setOpenId]=useState(null);
  const toggle=id=>setOpenId(prev=>prev===id?null:id);
  const byDept=d=>tasks.filter(t=>getDept(t)===d);
  const deptTasks=tasks.filter(t=>["RND","Marketing","Operations"].includes(getDept(t)));

  return e("div",{className:"columns-row"},
    e(AccordionColumn,{
      id:"departments",openId,onToggle:toggle,
      headerCls:"col-hdr-depts",icon:"🏢",label:"Departments",count:deptTasks.length,
      colCls:"col-departments"
    }, e(DepartmentsContent,{tasks:deptTasks,onStatusChange})),

    e(AccordionColumn,{
      id:"diwali",openId,onToggle:toggle,
      headerCls:"col-hdr-diwali",icon:"🪔",label:"Diwali Outreach",count:byDept("Diwali").length,
      extraBadge:"🔥 Priority",colCls:"col-diwali"
    }, e(DiwaliContent,{tasks:byDept("Diwali"),onStatusChange})),

    e(AccordionColumn,{
      id:"pipeline",openId,onToggle:toggle,
      headerCls:"col-hdr-pipeline",icon:"📦",label:"Pipeline",count:byDept("Pipeline").length
    }, e(PipelineContent,{tasks:byDept("Pipeline"),onStatusChange})),

    e(AccordionColumn,{
      id:"clients",openId,onToggle:toggle,
      headerCls:"col-hdr-clients",icon:"👥",label:"Clients",count:byDept("Clients").length
    }, e(ClientsContent,{tasks:byDept("Clients"),onStatusChange}))
  );
}

// ── EXEC TAB ──────────────────────────────────────────────────────────────────
function ExecTab({tasks,execName,overrides,onStatusChange,colorClass,salesData,salesLoading,salesError,dateFilter,setDateFilter,customFrom,customTo,onCustomChange}){
  const myTasks=tasks
    .filter(t=>t.Assignee===execName&&t["Task Name"])
    .map(t=>({...t,Status:overrides[t._id]||t["Status"]||"Not Started"}));

  const mySalesRows=useMemo(()=>salesData.filter(r=>{
    const poc=(r["POC"]||"").trim().toLowerCase().replace("prabhnoor","prabnoor");
    return poc===execName.toLowerCase();
  }),[salesData,execName]);

  const filteredSales=useMemo(()=>filterSalesByDate(mySalesRows,dateFilter,customFrom,customTo),[mySalesRows,dateFilter,customFrom,customTo]);
  const salesTotal=useMemo(()=>filteredSales.reduce((s,r)=>s+parseSalesAmt(r["Gross Sales "]||r["Gross Sales"]),0),[filteredSales]);
  const salesCount=filteredSales.length;

  return e("div",null,
    e(DateFilterBar,{value:dateFilter,onChange:setDateFilter,customFrom,customTo,onCustomChange,colorClass}),
    salesError && e("div",{className:"sales-error"},"⚠ Sales data unavailable: "+salesError),
    e(KPIBar,{tasks:myTasks,salesTotal,salesCount,salesLoading}),
    e(ProgressCard,{tasks:myTasks,colorClass,name:execName}),
    myTasks.length===0
      ? e("div",{className:"empty"},"No tasks yet — add them to the Google Sheet.")
      : e(ColumnsView,{tasks:myTasks,onStatusChange})
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [tasks,setTasks]=useState([]);
  const [overrides,setOverrides]=useState(loadOverrides);
  const [activeTab,setActiveTab]=useState(0);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [lastSync,setLastSync]=useState(null);
  const [salesData,setSalesData]=useState([]);
  const [salesLoading,setSalesLoading]=useState(true);
  const [salesError,setSalesError]=useState(null);
  const [dateFilter,setDateFilter]=useState("Lifetime");
  const [customFrom,setCustomFrom]=useState("");
  const [customTo,setCustomTo]=useState("");

  const handleCustomChange=(field,val)=>{
    if(field==="from") setCustomFrom(val);
    else setCustomTo(val);
  };

  const fetchTasks=useCallback(async()=>{
    try{
      const results=await Promise.all(EXEC_NAMES.map(async name=>{
        const res=await fetch(`${PROXY}?name=${name}`);
        if(!res.ok) throw new Error(`${res.status}`);
        const text=await res.text();
        if(text.startsWith("error:")) throw new Error(text);
        return parseCSV(text).map((r,i)=>({...r,_id:`${name}-${i}`,Assignee:name}));
      }));
      setTasks(results.flat());
      setLastSync(new Date());
      setError(null);
    }catch(err){
      setError("Could not load tasks. Check the Apps Script proxy.");
    }finally{
      setLoading(false);
    }
  },[]);

  const fetchSales=useCallback(async()=>{
    setSalesLoading(true);
    try{
      const res=await fetch(`${PROXY}?name=${SALES_SHEET_NAME}`);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const text=await res.text();
      if(text.startsWith("error:")) throw new Error(text.replace("error:","").trim());
      setSalesData(parseCSV(text));
      setSalesError(null);
    }catch(err){
      setSalesError(err.message);
    }finally{
      setSalesLoading(false);
    }
  },[]);

  useEffect(()=>{
    fetchTasks();
    fetchSales();
    const t1=setInterval(fetchTasks,60000);
    const t2=setInterval(fetchSales,120000);
    return()=>{clearInterval(t1);clearInterval(t2);};
  },[fetchTasks,fetchSales]);

  const handleStatus=(id,current)=>{
    const next=STATUS_CYCLE[(STATUS_CYCLE.indexOf(current||"Not Started")+1)%STATUS_CYCLE.length];
    const u={...overrides,[id]:next};
    setOverrides(u);
    saveOverrides(u);
  };

  const tabs=[
    {label:"Prabnoor",active:"active-prabnoor",colorClass:"green"},
    {label:"Kritik",active:"active-kritik",colorClass:"amber"},
  ];

  return e("div",null,
    e("header",{className:"app-header"},
      e("div",null,
        e("div",{className:"logo-mark"},"SNACKIBLE",e("span",{className:"logo-slash"},"/"),e("span",{className:"logo-b2b"},"B2B")),
        e("div",{className:"app-subtitle"},"Delegation · Tasks · Pipeline")
      ),
      e("div",{className:"header-right"},
        lastSync && e("span",{className:"sync-time"},e("span",{className:"live-dot"}),"Synced "+lastSync.toLocaleTimeString()),
        e("button",{className:"refresh-btn",onClick:()=>{fetchTasks();fetchSales();}},"↻ Refresh")
      )
    ),
    e("nav",{className:"tab-nav"},
      ...tabs.map((tab,i)=>
        e("button",{key:tab.label,className:`tab-btn ${activeTab===i?tab.active:""}`,onClick:()=>setActiveTab(i)},tab.label)
      )
    ),
    e("main",{className:"main-content"},
      loading ? e("div",{className:"loading"},e("div",{className:"spinner"}),"Loading tasks…")
      : error ? e("div",{className:"error-msg"},"⚠ "+error)
      : e(ExecTab,{
          tasks,
          execName:EXEC_NAMES[activeTab],
          overrides,
          onStatusChange:handleStatus,
          colorClass:tabs[activeTab].colorClass,
          salesData,salesLoading,salesError,
          dateFilter,setDateFilter,
          customFrom,customTo,
          onCustomChange:handleCustomChange
        })
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App,null));
</script>
</body>
</html>
